name: ghost_app_bar
description: >-
  Transparent collapsing app bar with an iOS-style large title that fades as
  you scroll. Content scrolls behind it and dissolves into the status bar with
  no seam. Theme-aware, zero dependencies.
version: 0.3.0
repository: https://github.com/jubairp10/ghost_app_bar
issue_tracker: https://github.com/jubairp10/ghost_app_bar/issues
topics:
  - appbar
  - ui
  - widget
  - animation
  - scroll

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
